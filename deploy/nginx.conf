# nginx server block for hosting the Happy Paint web app on a DigitalOcean
# Droplet (or any nginx host / Docker image). Serves the built Vite `dist/`.
#
# The SPA uses client-side routing, so unmatched paths must fall back to
# index.html (try_files ... /index.html). Hashed assets are cached hard;
# index.html is never cached so deploys take effect immediately.
#
# Usage on a Droplet:
#   1. npm ci && npm run build          # produces dist/
#   2. copy dist/ to /var/www/happypaint
#   3. put this file at /etc/nginx/sites-available/happypaint and symlink it
#      into sites-enabled, then: nginx -t && systemctl reload nginx
#   4. add TLS with certbot (certbot --nginx -d happypaint.app)

server {
    listen 80;
    listen [::]:80;
    server_name happypaint.app www.happypaint.app;

    root /var/www/happypaint;
    index index.html;

    # gzip text-like assets (Vite already minifies; this trims transfer).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets (e.g. index-XXXX.js, gif.worker-XXXX.js) are
    # content-addressed, so they can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unmatched path serves index.html so client-side
    # routes (/studio, /join/:code, /admin) resolve on direct load/refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entry so new deploys are picked up instantly.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Conservative security headers (kid-safe app; no embedding by others).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
