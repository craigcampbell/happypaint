# Optional trusted renderer. No extra public ports, service credentials or
# external renderer endpoint. The app forks the bounded worker over local IPC.
# Enable only after checkpoint/browser fidelity gates pass for the deployment.
# docker compose -f docker-compose.yml -f docker-compose.checkpoints.yml up -d --build app
services:
  app:
    build:
      target: checkpoint-runtime
    environment:
      ENABLE_TRUSTED_CHECKPOINTS: "1"
      CHECKPOINT_CHROME_PATH: /usr/bin/chromium-browser
      # A baseline render is a one-off background job that the whole room then
      # reuses, and a large mural needs far longer than the 45s default: an
      # isolated container measured ~17s for a 1,154-op frame, and production
      # logged 11 worker job timeouts against 1 success, so the cache never
      # warmed for the big rooms and every joiner replayed the full history
      # (3,518 ops = ~70s of client-side replay). Give the single worker room
      # to finish; the cache stays bounded and the job queue stays serialized.
      CHECKPOINT_JOB_TIMEOUT_MS: "240000"
    shm_size: 256mb
