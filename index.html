<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: the Android soft keyboard shrinks
         the layout viewport, so full-height modals (sheet picker) keep their
         footer buttons reachable while typing in search. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- SEO tags below carry data-seo markers so server.js can rewrite them
         per-route (per-room invites, per-post wall cards, page titles) without
         an SSR framework. Keep each marked tag on ONE line, the server does a
         whole-tag regex replace on the marker. -->
    <title data-seo="title">Drawesome 🎨, start drawing online for free</title>
    <meta name="description" content="Open a blank canvas and start drawing right away. Drawesome is a free online drawing studio with coloring pages, shared canvases, and drawing games. No account needed." data-seo="desc" />
    <meta name="theme-color" content="#f7ff54" />
    <link rel="canonical" href="https://drawesome.art/" data-seo="canonical" />

    <!-- Icons + installable web app -->
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Drawesome" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Social share previews -->
    <meta property="og:type" content="website" data-seo="og:type" />
    <meta property="og:site_name" content="Drawesome" />
    <meta property="og:title" content="Drawesome 🎨, start drawing online for free" data-seo="og:title" />
    <meta property="og:description" content="Open a blank canvas and start drawing right away. Free, no account needed, with coloring pages and shared canvases." data-seo="og:desc" />
    <meta property="og:url" content="https://drawesome.art/" data-seo="og:url" />
    <meta property="og:image" content="https://drawesome.art/og-image.png" data-seo="og:image" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Drawesome 🎨, start drawing online for free" data-seo="tw:title" />
    <meta name="twitter:description" content="Open a blank canvas and start drawing right away. Free, no account needed." data-seo="tw:desc" />
    <meta name="twitter:image" content="https://drawesome.art/og-image.png" data-seo="tw:image" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://drawesome.art/#website",
          "url": "https://drawesome.art/",
          "name": "Drawesome",
          "description": "A free online drawing studio with blank canvases, coloring pages, shared rooms, and drawing games.",
          "publisher": { "@id": "https://drawesome.art/#org" }
        },
        {
          "@type": "Organization",
          "@id": "https://drawesome.art/#org",
          "name": "Drawesome",
          "url": "https://drawesome.art/",
          "logo": "https://drawesome.art/icon-512.png"
        },
        {
          "@type": "WebApplication",
          "name": "Drawesome",
          "url": "https://drawesome.art/",
          "applicationCategory": "DesignApplication",
          "operatingSystem": "Any",
          "browserRequirements": "Requires JavaScript",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "audience": { "@type": "PeopleAudience", "suggestedMinAge": 13 }
        }
      ]
    }
    </script>

    <!-- Google tag (gtag.js), site-wide pageviews. Loaded async so it never
         blocks the canvas; no data-seo marker, so server.js leaves it alone.

         OPT-OUT, so the owner's own traffic never counts:
           * visit once with ?ga=off on any device and this browser is excluded
             from every Google Analytics hit from then on (?ga=on undoes it);
           * localhost / 127.0.0.1 / *.local hosts are always excluded;
           * when excluded the gtag.js script is never even fetched, and the
             ga-disable global is set as a second line of defence.
         The flag lives in localStorage('drawesome:ga:off'), so it survives
         reloads and applies to every page of the site. -->
    <script>
      (function () {
        var GA_ID = "G-9TG5C3N1YP";
        var OFF_KEY = "drawesome:ga:off";
        var skip = false;
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        try {
          var flag = new URLSearchParams(window.location.search).get("ga");
          if (flag === "off" || flag === "0") window.localStorage.setItem(OFF_KEY, "1");
          else if (flag === "on" || flag === "1") window.localStorage.removeItem(OFF_KEY);
          var host = window.location.hostname;
          skip = window.localStorage.getItem(OFF_KEY) === "1"
            || host === "localhost" || host === "127.0.0.1" || host === "0.0.0.0"
            || host.slice(-6) === ".local";
        } catch (err) {
          // Storage blocked (private mode, hardened browser): measure normally
          // rather than silently dropping every visitor into the same bucket.
        }
        gtag("js", new Date());
        if (skip) {
          window["ga-disable-" + GA_ID] = true;
          return;
        }
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
        document.head.appendChild(s);
        gtag("config", GA_ID);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
