<!doctype html>
<!--
  Brush lab — a headless harness page for the brush engine.

  Served by the vite DEV server only (vite serves any .html under the project
  root in dev; this folder is NOT part of the production build, and nothing here
  is imported by src/). Driven by scripts/brush-lab.mjs through Playwright via
  `window.lab.runScenario(spec)`; it also works by hand at
  http://127.0.0.1:5175/scripts/lab/index.html with the normal `npm run dev`
  server (open the console and call lab.runScenario({ kind: "contact" })).

  The page drives ONLY the engine's public exports (brushes.js, strokeBuffer.js,
  mixMap.js, layers.js, opReplay.js) and mirrors how App.jsx uses them —
  settings built with getAuthoringDab, one point per addPoints call,
  prepareStrokeCommit + commit at pen-up, markDirty on the mix map after every
  commit — so it keeps working as the engine changes underneath it. No React,
  no app code. The `golden` scenario replays the frozen op fixture
  (golden-ops.json) through opReplay.replayFrameOnto and hashes the pixels;
  measurePenUpPop / flushGpu / hashCanvas are exported on window.lab for the
  brush-engine stages that build on this baseline.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Brush lab</title>
  <style>
    body { margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; background: #e9e6df; color: #222; }
    #status { white-space: pre-wrap; margin-bottom: 8px; }
    #out canvas { display: block; margin: 8px 0; box-shadow: 0 1px 4px rgba(0,0,0,.25); max-width: 100%; }
    #out h3 { margin: 12px 0 2px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="status">loading engine…</div>
  <div id="out"></div>
  <script type="module">
    // Dynamic imports from the vite dev server root, so a broken engine module
    // surfaces as a loud page error (window.lab.error) instead of a hang.
    const status = document.getElementById("status");
    const out = document.getElementById("out");

    let engine;
    try {
      const [brushes, strokeBuffer, mixMap, layers, opReplay] = await Promise.all([
        import("/src/utils/brushes.js"),
        import("/src/utils/strokeBuffer.js"),
        import("/src/utils/mixMap.js"),
        import("/src/utils/layers.js"),
        import("/src/utils/opReplay.js"),
      ]);
      engine = { ...brushes, ...strokeBuffer, ...mixMap, ...layers, ...opReplay };
    } catch (error) {
      status.textContent = `engine import failed: ${error?.message || error}`;
      window.lab = { ready: false, error: String(error?.stack || error) };
      throw error;
    }

    const {
      brushCatalog,
      getAuthoringDab,
      makeStrokeEntryCore,
      makeSmudgeRenderer,
      prepareStrokeCommit,
      drawBrushSegment,
      pointRand,
      createMixMap,
      CANVAS_WIDTH,
      CANVAS_HEIGHT,
      replayFrameOnto,
    } = engine;

    // ---- Tile geometry ----------------------------------------------------
    const TILE_W = 900;
    const TILE_H = 600;
    const STROKE_POINTS = 600;
    // Fixed seeds: every lab run rolls the same dice, so two runs (before /
    // after an engine change) differ only by the engine.
    const SEED_A = 0x1234abcd;
    const SEED_B = 0x0badf00d;
    const COLORS = { blue: "#2f6fd6", red: "#e04b2a", yellow: "#f9d423", mixBlue: "#1e88e5" };

    const listBrushes = (filter) => {
      const ids = brushCatalog.map((b) => b.id).filter((id) => id !== "eraser" && id !== "smudge");
      if (!filter || !filter.length) {
        return ids;
      }
      const wanted = new Set(filter);
      return ids.filter((id) => wanted.has(id));
    };

    const makeCanvas = (w, h) => {
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      return canvas;
    };

    const q4 = (v) => Math.round(v * 4) / 4; // the wire's quarter-px quantization

    // Standard S-curve stroke: ~600 points across a tile-relative box, pressure
    // 0.15 → 1 (at 55% of the path) → 0.3, quarter-px quantized coords, and a
    // stationary duplicate point every 97 points (the pressure-only updates a
    // real pointer stream produces — the engine must skip them without moving
    // its walk state). `flip` mirrors the curve vertically so a second stroke
    // crosses the first.
    const makeStroke = ({ x0 = 0, y0 = 0, w = TILE_W, h = TILE_H, flip = false, count = STROKE_POINTS, pressure = null } = {}) => {
      const points = [];
      const left = x0 + w * 0.09;
      const right = x0 + w * 0.91;
      const midY = y0 + h * 0.5;
      const amp = h * 0.27;
      for (let i = 0; i < count; i += 1) {
        const t = i / (count - 1);
        const x = left + (right - left) * t;
        const y = midY + (flip ? -1 : 1) * amp * Math.sin(t * Math.PI * 2);
        let p;
        if (pressure != null) {
          p = pressure;
        } else if (t < 0.55) {
          p = 0.15 + 0.85 * (t / 0.55);
        } else {
          p = 1 - 0.7 * ((t - 0.55) / 0.45);
        }
        const point = { x: q4(x), y: q4(y), pressure: Math.round(p * 1000) / 1000 };
        points.push(point);
        if (i > 0 && i % 97 === 0) {
          // stationary duplicate: same coords, slightly different pressure
          points.push({ x: point.x, y: point.y, pressure: Math.min(1, point.pressure + 0.02) });
        }
      }
      return points;
    };

    // Build settings exactly like App.jsx startStroke does for a fresh stroke.
    const makeSettings = (brushId, { color, size, opacity = 1, seed, wet = false }) => {
      const authoring = getAuthoringDab(brushId);
      const settings = { brush: brushId, color, size, opacity, variation: 0, seed };
      if (authoring) {
        settings.v = authoring.version;
        if (authoring.version >= 3) {
          settings.dab = authoring.dab;
        }
        if (wet) {
          settings.wet = true;
        }
      }
      return { settings, fx: authoring ? authoring.dab : null };
    };

    // A ctx Proxy that counts the raster calls the engine makes — so timing
    // can be normalised per dab / per op. Forwards everything else untouched.
    const COUNTED = new Set(["fill", "stroke", "drawImage", "fillRect", "strokeRect", "fillText", "putImageData"]);
    const makeCountingCtx = (ctx) => {
      const counts = { ops: 0, fill: 0, stroke: 0, drawImage: 0, fillRect: 0, getImageData: 0, save: 0 };
      const proxy = new Proxy(ctx, {
        get(target, prop) {
          const value = target[prop];
          if (typeof value !== "function") {
            return value;
          }
          return (...args) => {
            if (COUNTED.has(prop)) {
              counts.ops += 1;
              counts[prop] = (counts[prop] || 0) + 1;
            } else if (prop === "getImageData") {
              counts.getImageData += 1;
            } else if (prop === "save") {
              counts.save += 1;
            }
            return value.apply(target, args);
          };
        },
        set(target, prop, value) {
          target[prop] = value;
          return true;
        },
      });
      return { proxy, counts };
    };

    // Canvas 2D records draw calls and rasterises them lazily, so a clock
    // stopped right after the last addPoints measures how fast Chrome can
    // QUEUE work, not draw it. A 1x1 readback is the cheapest synchronous
    // fence: it forces everything recorded on that canvas to land first.
    //
    // ONE-READBACK RULE: fence a timed canvas once per clock, never in a
    // loop that spans frames. Chrome's willReadFrequently heuristic counts
    // getImageData calls per canvas across successive frames and, once it
    // trips, demotes that canvas to CPU rasterisation for good — a second
    // fence on a timed buffer in a later frame would silently turn a --gpu
    // timing run into a software one for the rest of the page (the commit
    // column would read like the software table's, with no error anywhere).
    // paintStroke fences the buffer once (after the add clock) and the
    // target once per clock; the pixel readbacks the scenarios do for stats
    // and hashes all happen after that canvas's timing is over.
    const flushGpu = (ctx) => {
      ctx.getImageData(0, 0, 1, 1);
    };

    // Paint one stroke onto `targetCtx` the way App.jsx does: per-point
    // ensure() → addPoints (batched `batch` points at a time), overflow
    // banking, then prepareStrokeCommit + a single opacity commit. Legacy
    // brushes (no authoring dab, e.g. spray) go through drawBrushSegment per
    // segment, like the app's non-dab branch. Returns timing + op counts.
    // Timing: addMs stops only after flushGpu on the buffer (where the dabs
    // landed) AND the target (overflow banks), commitMs after a flush of the
    // target — both are real raster time, not queue time.
    // Hooks: `beforeCommit(buf, settings, fx)` runs after the last point and
    // before prepareStrokeCommit (the pen-up-pop probe); `composite`
    // overrides the commit's blend mode (default: the stroke's own, from
    // getStrokeComposite via the shared entry core — multiply for the v3
    // marker / pencil / watercolor, source-over for everything else).
    const paintStroke = (targetCtx, brushId, points, opts) => {
      const { settings } = makeSettings(brushId, opts);
      const batch = opts.batch || 1;
      const mix = opts.mix || null;
      // The same entry core App.jsx / opReplay build their strokes from.
      const { buf, renderer, fx, drawSettings, pad } = makeStrokeEntryCore(settings, mix ? mix.sample : undefined);
      if (opts.composite) buf.composite = opts.composite;
      const totals = { ops: 0, fill: 0, stroke: 0, drawImage: 0, fillRect: 0, getImageData: 0, save: 0 };
      // The buffer's ctx can be swapped by a grow (ensure) — re-wrap when it
      // changes and fold the old counter into the totals.
      let counter = null;
      const absorb = () => {
        if (counter) {
          for (const key of Object.keys(totals)) totals[key] += counter.counts[key] || 0;
          counter = null;
        }
      };
      const drawCtx = () => {
        const ctx = buf.getCtx();
        if (!opts.count) {
          return ctx;
        }
        if (!counter || counter.raw !== ctx) {
          absorb();
          counter = { raw: ctx, ...makeCountingCtx(ctx) };
        }
        return counter.proxy;
      };
      if (opts.preEnsure) {
        // Size the buffer over the WHOLE stroke up front so no mid-stroke
        // grow happens (a grow re-allocates and drawImage-copies the buffer,
        // which is not pixel-lossless on AA edges — see the determinism
        // scenario). Not the app's flow; used to isolate the renderer walk.
        for (const point of points) buf.ensure(point.x, point.y, pad);
      }
      let lastPoint = points[0];
      const t0 = performance.now();
      for (let i = 0; i < points.length; i += batch) {
        const slice = points.slice(i, i + batch);
        for (const point of slice) {
          if (buf.ensure(point.x, point.y, pad).overflow) {
            absorb();
            prepareStrokeCommit(buf, renderer, fx, false); // overflow chunk, as App / opReplay bank it
            buf.commit(targetCtx, settings.opacity);
            if (mix) mix.markDirty(buf.bounds());
            buf.reset();
            buf.ensure(point.x, point.y, pad);
          }
        }
        if (renderer) {
          renderer.addPoints(drawCtx(), slice, buf.base());
        } else {
          for (const point of slice) {
            drawBrushSegment(drawCtx(), lastPoint, point, drawSettings, pointRand(settings.seed, point.x, point.y));
            lastPoint = point;
          }
        }
      }
      // Drain the queue before stopping the clock (raw ctx, so the counting
      // Proxy never sees this readback as a draw-path getImageData).
      if (buf.has()) flushGpu(buf.getCtx());
      flushGpu(targetCtx);
      const t1 = performance.now();
      absorb();
      if (opts.beforeCommit) opts.beforeCommit(buf, settings, fx);
      const t1b = performance.now();
      prepareStrokeCommit(buf, renderer, fx);
      buf.commit(targetCtx, settings.opacity); // the buffer's own composite
      flushGpu(targetCtx);
      const t2 = performance.now();
      if (mix) mix.markDirty(buf.bounds());
      const bounds = buf.bounds();
      buf.dispose();
      return { addMs: t1 - t0, commitMs: t2 - t1b, counts: totals, bounds };
    };

    // RGB-on-white bytes for a rect of an RGBA canvas (what the viewer sees;
    // raw RGBA deltas blow up at low alpha — see comparePixels).
    const onWhiteBytes = (ctx, rect) => {
      const data = ctx.getImageData(rect.x, rect.y, rect.w, rect.h).data;
      const out = new Uint8ClampedArray((data.length / 4) * 3);
      for (let i = 0, o = 0; i < data.length; i += 4, o += 3) {
        const a = data[i + 3] / 255;
        out[o] = data[i] * a + 255 * (1 - a);
        out[o + 1] = data[i + 1] * a + 255 * (1 - a);
        out[o + 2] = data[i + 2] * a + 255 * (1 - a);
      }
      return out;
    };

    // Pen-up "pop": how much the committed stroke differs from what the live
    // preview showed a frame earlier. The preview (App renderStrokeFrame /
    // remote overlays) composites the raw buffer over the document at the
    // stroke's opacity with `composite`; the commit first runs
    // prepareStrokeCommit (wet edge / impasto / grain) inside the buffer, then
    // buf.commit at the same opacity + composite. Measured on white over the
    // buffer bbox: `meanDelta` = mean |Δ| / 255 over every RGB byte in the
    // bbox (the spec's number, diluted by untouched paper), `meanDeltaStroke`
    // = the same over pixels the stroke actually touched, plus the max and
    // the fraction of stroke pixels that moved by more than 2/255. Same opts
    // as paintStroke; the stroke is painted onto targetCtx as a side effect.
    const measurePenUpPop = (targetCtx, brushId, points, opts = {}) => {
      let before = null;
      let preview = null;
      let rect = null;
      const r = paintStroke(targetCtx, brushId, points, {
        ...opts,
        beforeCommit: (buf, settings) => {
          if (!buf.has()) return;
          const b = buf.bounds();
          const target = targetCtx.canvas;
          const x = Math.max(0, b.x0);
          const y = Math.max(0, b.y0);
          rect = { x, y, w: Math.min(target.width, b.x0 + b.w) - x, h: Math.min(target.height, b.y0 + b.h) - y };
          if (rect.w <= 0 || rect.h <= 0) {
            rect = null;
            return;
          }
          before = onWhiteBytes(targetCtx, rect);
          // The preview frame: document so far + buffer at opacity/composite.
          const snap = makeCanvas(rect.w, rect.h);
          const sctx = snap.getContext("2d");
          sctx.drawImage(target, rect.x, rect.y, rect.w, rect.h, 0, 0, rect.w, rect.h);
          sctx.setTransform(1, 0, 0, 1, -rect.x, -rect.y); // world coords, like the display path
          buf.commit(sctx, settings.opacity); // the stroke's composite, like the live preview
          sctx.setTransform(1, 0, 0, 1, 0, 0);
          preview = onWhiteBytes(sctx, { x: 0, y: 0, w: rect.w, h: rect.h });
          snap.width = 0;
        },
      });
      const pop = { meanDelta: 0, meanDeltaStroke: 0, maxDelta: 0, changedFraction: 0, strokePixels: 0, bbox: rect };
      if (!rect) {
        return { ...r, pop };
      }
      const after = onWhiteBytes(targetCtx, rect);
      let sum = 0;
      let sumStroke = 0;
      let strokePx = 0;
      let changed = 0;
      let max = 0;
      for (let p = 0; p < before.length; p += 3) {
        const d0 = Math.abs(preview[p] - after[p]);
        const d1 = Math.abs(preview[p + 1] - after[p + 1]);
        const d2 = Math.abs(preview[p + 2] - after[p + 2]);
        const d = d0 + d1 + d2;
        sum += d;
        const dm = Math.max(d0, d1, d2);
        if (dm > max) max = dm;
        // Stroke pixel = the preview or the commit changed it vs the paper before.
        if (
          preview[p] !== before[p] || preview[p + 1] !== before[p + 1] || preview[p + 2] !== before[p + 2] ||
          after[p] !== before[p] || after[p + 1] !== before[p + 1] || after[p + 2] !== before[p + 2]
        ) {
          strokePx += 1;
          sumStroke += d;
          if (dm > 2) changed += 1;
        }
      }
      pop.meanDelta = +(sum / before.length / 255).toFixed(5);
      pop.meanDeltaStroke = strokePx ? +(sumStroke / (strokePx * 3) / 255).toFixed(5) : 0;
      pop.maxDelta = max;
      pop.changedFraction = strokePx ? +(changed / strokePx).toFixed(4) : 0;
      pop.strokePixels = strokePx;
      return { ...r, pop };
    };

    // Composite a transparent work canvas onto white (the app's paper) for the
    // saved PNGs. The engine always paints onto TRANSPARENT layer canvases, so
    // work canvases stay transparent — a white fill would make the wet mix map
    // pick up "white paint" everywhere.
    const onWhite = (work) => {
      const outCanvas = makeCanvas(work.width, work.height);
      const ctx = outCanvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, outCanvas.width, outCanvas.height);
      ctx.drawImage(work, 0, 0);
      return outCanvas;
    };

    const label = (ctx, text, x, y, size = 16) => {
      ctx.save();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      ctx.font = `600 ${size}px system-ui, sans-serif`;
      ctx.fillStyle = "#222";
      ctx.textBaseline = "top";
      ctx.fillText(text, x, y);
      ctx.restore();
    };

    // Pixel stats over an RGBA canvas (a one-off getImageData: this is the
    // test, not the draw path). `rect` is optional {x, y, w, h}.
    const pixelStats = (canvas, rect) => {
      const ctx = canvas.getContext("2d");
      const r = rect || { x: 0, y: 0, w: canvas.width, h: canvas.height };
      const data = ctx.getImageData(r.x, r.y, r.w, r.h).data;
      let painted = 0;
      let sr = 0;
      let sg = 0;
      let sb = 0;
      let sa = 0;
      for (let i = 0; i < data.length; i += 4) {
        const a = data[i + 3];
        if (a > 0) {
          painted += 1;
          sr += data[i];
          sg += data[i + 1];
          sb += data[i + 2];
          sa += a;
        }
      }
      const n = painted || 1;
      return {
        pixels: r.w * r.h,
        painted,
        coverage: painted / (r.w * r.h),
        meanRgb: [Math.round(sr / n), Math.round(sg / n), Math.round(sb / n)],
        meanAlpha: Math.round(sa / n),
      };
    };

    // Mean RGB as seen on white paper (alpha-composited).
    const meanOnWhite = (canvas, rect) => {
      const ctx = canvas.getContext("2d");
      const data = ctx.getImageData(rect.x, rect.y, rect.w, rect.h).data;
      let sr = 0;
      let sg = 0;
      let sb = 0;
      const n = data.length / 4;
      for (let i = 0; i < data.length; i += 4) {
        const a = data[i + 3] / 255;
        sr += data[i] * a + 255 * (1 - a);
        sg += data[i + 1] * a + 255 * (1 - a);
        sb += data[i + 2] * a + 255 * (1 - a);
      }
      return [Math.round(sr / n), Math.round(sg / n), Math.round(sb / n)];
    };

    // Exact RGBA comparison. `maxChannelDelta` is on the raw (un-premultiplied)
    // bytes getImageData hands back, which blows tiny differences up at low
    // alpha (alpha 2: premultiplied 1 vs 2 reads as 128 vs 255), so
    // `maxVisibleDelta` also reports the largest difference as SEEN on white
    // paper — the number that says whether a mismatch is cosmetic.
    const comparePixels = (a, b) => {
      const da = a.getContext("2d").getImageData(0, 0, a.width, a.height).data;
      const db = b.getContext("2d").getImageData(0, 0, b.width, b.height).data;
      let differing = 0;
      let maxDelta = 0;
      let maxVisible = 0;
      for (let i = 0; i < da.length; i += 4) {
        const d = Math.max(Math.abs(da[i] - db[i]), Math.abs(da[i + 1] - db[i + 1]), Math.abs(da[i + 2] - db[i + 2]), Math.abs(da[i + 3] - db[i + 3]));
        if (d > 0) {
          differing += 1;
          if (d > maxDelta) maxDelta = d;
          const aa = da[i + 3] / 255;
          const ab = db[i + 3] / 255;
          for (let c = 0; c < 3; c += 1) {
            const va = da[i + c] * aa + 255 * (1 - aa);
            const vb = db[i + c] * ab + 255 * (1 - ab);
            const dv = Math.abs(va - vb);
            if (dv > maxVisible) maxVisible = dv;
          }
        }
      }
      return { identical: differing === 0, differingPixels: differing, maxChannelDelta: maxDelta, maxVisibleDelta: Math.round(maxVisible) };
    };

    const median = (values) => {
      const sorted = [...values].sort((a, b) => a - b);
      const mid = sorted.length >> 1;
      return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    };

    // HSL hue (degrees, NaN for grey) + saturation of an RGB triple: the
    // mixing gate's units ("green, not grey").
    const hueSat = ([r, g, b]) => {
      r /= 255;
      g /= 255;
      b /= 255;
      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      const d = max - min;
      const l = (max + min) / 2;
      if (d === 0) return { hue: NaN, sat: 0, luma: +l.toFixed(3) };
      const sat = d / (1 - Math.abs(2 * l - 1));
      let h;
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
      return { hue: +h.toFixed(1), sat: +sat.toFixed(3), luma: +l.toFixed(3) };
    };
    const rgbDistance = (a, b) => Math.round(Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]));

    // Brushes whose NEXT stroke mixes pigment (Stage 3): the authoring dab
    // says mixModel "km" and has a dry mix or a wet pickup to sample with.
    const kmParams = (brushId) => {
      const dab = getAuthoringDab(brushId)?.dab;
      if (!dab || dab.mixModel !== "km") return null;
      return { dry: (dab.mix || 0) > 0, wet: (dab.pickup || 0) > 0 };
    };

    const show = (title, canvas) => {
      const h3 = document.createElement("h3");
      h3.textContent = title;
      out.appendChild(h3);
      out.appendChild(canvas);
    };

    const emit = (images, name, canvas) => {
      images.push({ name, dataUrl: canvas.toDataURL("image/png"), width: canvas.width, height: canvas.height });
      show(name, canvas);
    };

    // ---- Scenarios ----------------------------------------------------------

    // (a) STROKES: per brush, 3 tiles (sizes 12/32/80) stacked; blue S-curve
    // then a red mirrored S-curve crossing it, so overlap behaviour shows.
    // Both strokes go through measurePenUpPop, so `penUpPop` records how far
    // the commit lands from the live preview (the second stroke, over paint,
    // is the realistic case; `worst` is the larger of the two).
    const scenarioStrokes = ({ brushes, sizes = [12, 32, 80] }) => {
      const images = [];
      const report = {};
      for (const brushId of brushes) {
        const sheet = makeCanvas(TILE_W, TILE_H * sizes.length);
        const sheetCtx = sheet.getContext("2d");
        sheetCtx.fillStyle = "#ffffff";
        sheetCtx.fillRect(0, 0, sheet.width, sheet.height);
        report[brushId] = {};
        sizes.forEach((size, index) => {
          const work = makeCanvas(TILE_W, TILE_H);
          const ctx = work.getContext("2d");
          const a = measurePenUpPop(ctx, brushId, makeStroke(), { color: COLORS.blue, size, seed: SEED_A });
          const b = measurePenUpPop(ctx, brushId, makeStroke({ flip: true }), { color: COLORS.red, size, seed: SEED_B });
          const stats = pixelStats(work);
          const worst = a.pop.meanDeltaStroke >= b.pop.meanDeltaStroke ? a.pop : b.pop;
          report[brushId][size] = {
            coverage: +stats.coverage.toFixed(4),
            meanRgb: stats.meanRgb,
            meanAlpha: stats.meanAlpha,
            addMs: +(a.addMs + b.addMs).toFixed(2),
            commitMs: +(a.commitMs + b.commitMs).toFixed(2),
            penUpPop: { first: a.pop, second: b.pop, worst },
          };
          sheetCtx.drawImage(work, 0, index * TILE_H);
          label(sheetCtx, `${brushId}  size ${size}`, 12, index * TILE_H + 10);
          if (index > 0) {
            sheetCtx.fillStyle = "#c9c4b8";
            sheetCtx.fillRect(0, index * TILE_H, TILE_W, 1);
          }
          work.width = 0;
        });
        emit(images, `strokes-${brushId}.png`, sheet);
      }
      return { images, report };
    };

    // (b) MIXING: yellow over blue and blue over yellow, dry then wet, for the
    // paint-like brushes. The second stroke runs ALONG the first for a stretch
    // (not just across it) so wet pickup has something to drag. Overlap
    // region = the shared stretch; its mean RGB on white is recorded, with
    // its HSL hue / saturation — the Stage-3 gate:
    //   km brushes (oil / acrylic / paint / gouache): yellow over blue reads
    //     GREEN dry AND wet — hue 70..170°, saturation >= 0.2 (not grey);
    //   watercolor: dry mixing is the multiply glaze (mix 0) — hue 70..170°
    //     (its saturation floor is lower: a thin wash on white is pale);
    //   sample-free brushes (marker, ink, pencil, crayon, glow, spray): a
    //     stroke pair with a mix map — dry or flagged wet — hashes identical
    //     to one without (they never sample, so Stage 3 can't touch them).
    // Plus CARRY RECOVERY (km brushes with a wet pickup): a wet yellow stroke
    // crosses a blue patch, then runs 300 px on over blank paper — the mean
    // colour of its last 20% must be closer to the brush colour than to blue
    // (the carried colour fades out; the legacy lerp never recovered).
    const MIX_BRUSHES = ["watercolor", "oil", "acrylic", "gouache", "marker", "paint"];
    const MIX_HUE = [70, 170];
    const MIX_SAT = 0.2;
    const WASH_SAT = 0.08;
    const RECOVERY_PATCH = { x: 60, w: 200 }; // the blue patch, in tile px
    const RECOVERY_TAIL = 300; // px of blank paper after the patch
    const mixPath = ({ x0, y0, w, h, along }) => {
      // `along`: a gentle wave across the tile (stroke A); otherwise a path
      // that dives onto A's wave, rides it for the middle 40%, then leaves.
      const points = [];
      const count = STROKE_POINTS;
      const waveY = (t) => y0 + h * 0.5 + h * 0.08 * Math.sin(t * Math.PI * 3);
      for (let i = 0; i < count; i += 1) {
        const t = i / (count - 1);
        const x = x0 + w * (0.08 + 0.84 * t);
        let y;
        if (along) {
          y = waveY(t);
        } else if (t < 0.3) {
          const u = t / 0.3;
          y = y0 + h * 0.86 + (waveY(0.3) - (y0 + h * 0.86)) * (u * u);
        } else if (t < 0.7) {
          y = waveY(t);
        } else {
          const u = (t - 0.7) / 0.3;
          y = waveY(0.7) + ((y0 + h * 0.12) - waveY(0.7)) * (u * u);
        }
        points.push({ x: q4(x), y: q4(y), pressure: 0.75 });
      }
      return points;
    };
    const scenarioMixing = ({ brushes, size = 40 }) => {
      const wanted = MIX_BRUSHES.filter((id) => brushes.includes(id));
      const images = [];
      const report = {};
      const checks = [];
      const check = (brushId, name, pass, detail) => {
        checks.push({ brush: brushId, name, pass, detail });
        return pass;
      };
      const tw = TILE_W / 2;
      const th = TILE_H / 2;
      const inHue = (hs) => hs.hue >= MIX_HUE[0] && hs.hue <= MIX_HUE[1];
      // Sample-free brushes: the same stroke pair with and without a mix map
      // (dry, and flagged wet) must hash identical. Every brush in the run
      // without km params is checked — not just the mixing tiles'.
      const sampleFree = {};
      for (const brushId of brushes) {
        if (kmParams(brushId)) continue;
        const render = (withMap, wet) => {
          const work = makeCanvas(tw, th);
          const ctx = work.getContext("2d");
          const mix = withMap ? createMixMap(() => work, work.width, work.height) : null;
          const box = { x0: 0, y0: 0, w: tw, h: th };
          paintStroke(ctx, brushId, mixPath({ ...box, along: true }), { color: COLORS.mixBlue, size, seed: SEED_A, wet, mix });
          paintStroke(ctx, brushId, mixPath({ ...box, along: false }), { color: COLORS.yellow, size, seed: SEED_B, wet, mix });
          return work;
        };
        const plain = render(false, false);
        const dryMap = render(true, false);
        const wetMap = render(true, true);
        const dry = comparePixels(plain, dryMap);
        const wet = comparePixels(plain, wetMap);
        const overlap = { x: Math.round(tw * 0.4), y: Math.round(th * 0.5 - size / 4), w: Math.round(tw * 0.2), h: Math.round(size / 2) };
        const mean = meanOnWhite(plain, overlap);
        sampleFree[brushId] = { overlapMeanRgb: mean, ...hueSat(mean), dryIdentical: dry.identical, wetIdentical: wet.identical, dryDiff: dry.differingPixels, wetDiff: wet.differingPixels };
        check(brushId, "sampleFree", dry.identical && wet.identical, `a mix map changes a sample-free brush (dry diff ${dry.differingPixels}px, wet diff ${wet.differingPixels}px)`);
        [plain, dryMap, wetMap].forEach((c) => { c.width = 0; });
      }
      for (const brushId of wanted) {
        const km = kmParams(brushId);
        const work = makeCanvas(TILE_W, TILE_H);
        const ctx = work.getContext("2d");
        // One mix map over the whole work canvas — this canvas plays layer 0.
        const mix = createMixMap(() => work, work.width, work.height);
        report[brushId] = {};
        const cells = [
          { wet: false, first: "mixBlue", second: "yellow", key: "dry_yellowOverBlue" },
          { wet: false, first: "yellow", second: "mixBlue", key: "dry_blueOverYellow" },
          { wet: true, first: "mixBlue", second: "yellow", key: "wet_yellowOverBlue" },
          { wet: true, first: "yellow", second: "mixBlue", key: "wet_blueOverYellow" },
        ];
        cells.forEach((cell, index) => {
          const x0 = (index % 2) * tw;
          const y0 = Math.floor(index / 2) * th;
          const box = { x0, y0, w: tw, h: th };
          paintStroke(ctx, brushId, mixPath({ ...box, along: true }), { color: COLORS[cell.first], size, seed: SEED_A, wet: cell.wet, mix });
          paintStroke(ctx, brushId, mixPath({ ...box, along: false }), { color: COLORS[cell.second], size, seed: SEED_B, wet: cell.wet, mix });
          // Overlap = the shared middle stretch, a band size/2 tall around
          // the wave's centre line; firstOnly = a patch the second stroke
          // never reaches, for reference.
          const overlap = { x: Math.round(x0 + tw * 0.4), y: Math.round(y0 + th * 0.5 - size / 4), w: Math.round(tw * 0.2), h: Math.round(size / 2) };
          const firstOnly = { x: Math.round(x0 + tw * 0.1), y: Math.round(y0 + th * 0.5 - size / 4), w: Math.round(tw * 0.08), h: Math.round(size / 2) };
          const overlapMeanRgb = meanOnWhite(work, overlap);
          const hs = hueSat(overlapMeanRgb);
          report[brushId][cell.key] = {
            overlapMeanRgb,
            ...hs,
            firstStrokeMeanRgb: meanOnWhite(work, firstOnly),
            overlapRect: overlap,
          };
          if (cell.key === "dry_yellowOverBlue" || cell.key === "wet_yellowOverBlue") {
            // The gate: yellow over blue reads green. km brushes dry via
            // `mix`, wet via `pickup`; watercolor dry via the multiply glaze.
            const gated = brushId === "watercolor" ? cell.key === "dry_yellowOverBlue" : !!km && (cell.wet ? km.wet : km.dry);
            if (gated) {
              const satFloor = brushId === "watercolor" ? WASH_SAT : MIX_SAT;
              check(brushId, cell.key, inHue(hs) && hs.sat >= satFloor, `overlap [${overlapMeanRgb}] hue ${hs.hue} sat ${hs.sat} (want hue ${MIX_HUE[0]}..${MIX_HUE[1]}, sat >= ${satFloor})`);
            }
          }
        });
        // CARRY RECOVERY strip (km brushes with a wet pickup): blue patch,
        // wet yellow stroke through it and RECOVERY_TAIL px beyond.
        let recovery = null;
        let strip = null;
        if (km && km.wet) {
          strip = makeCanvas(TILE_W, th);
          const stripCtx = strip.getContext("2d");
          const y = th / 2;
          stripCtx.fillStyle = COLORS.mixBlue;
          stripCtx.fillRect(RECOVERY_PATCH.x, y - 100, RECOVERY_PATCH.w, 200);
          const patchEnd = RECOVERY_PATCH.x + RECOVERY_PATCH.w;
          const x1 = patchEnd + RECOVERY_TAIL;
          const points = [];
          for (let i = 0; i < STROKE_POINTS; i += 1) {
            const t = i / (STROKE_POINTS - 1);
            points.push({ x: q4(40 + (x1 - 40) * t), y: q4(y), pressure: 0.75 });
          }
          const stripMix = createMixMap(() => strip, strip.width, strip.height);
          paintStroke(stripCtx, brushId, points, { color: COLORS.yellow, size, seed: SEED_A, wet: true, mix: stripMix });
          const band = (x, w) => ({ x: Math.round(x), y: Math.round(y - size / 4), w: Math.round(w), h: Math.round(size / 2) });
          const tailStart = x1 - RECOVERY_TAIL * 0.2;
          const last = meanOnWhite(strip, band(tailStart, x1 - tailStart - 4));
          const onPatch = meanOnWhite(strip, band(RECOVERY_PATCH.x + 60, RECOVERY_PATCH.w - 80));
          const justAfter = meanOnWhite(strip, band(patchEnd + 8, 40));
          const yellow = [249, 212, 35];
          const blue = [30, 136, 229];
          recovery = {
            onPatchMeanRgb: onPatch,
            onPatch: hueSat(onPatch),
            justAfterMeanRgb: justAfter,
            lastFifthMeanRgb: last,
            lastFifth: hueSat(last),
            distanceToBrush: rgbDistance(last, yellow),
            distanceToBlue: rgbDistance(last, blue),
            tailPx: RECOVERY_TAIL,
          };
          recovery.recovered = recovery.distanceToBrush < recovery.distanceToBlue;
          check(brushId, "carryRecovery", recovery.recovered, `last 20% of a ${RECOVERY_TAIL}px tail [${last}] is ${recovery.distanceToBrush} from the brush colour, ${recovery.distanceToBlue} from blue`);
          report[brushId].recovery = recovery;
        }
        const sheet = makeCanvas(TILE_W, TILE_H + (strip ? th : 0));
        const sctx = sheet.getContext("2d");
        sctx.fillStyle = "#ffffff";
        sctx.fillRect(0, 0, sheet.width, sheet.height);
        sctx.drawImage(work, 0, 0);
        if (strip) {
          sctx.drawImage(strip, 0, TILE_H);
          label(sctx, `${brushId}  wet yellow across a blue patch, then ${RECOVERY_TAIL} px of paper  →  last 20% [${recovery.lastFifthMeanRgb}] ${recovery.recovered ? "recovered" : "STUCK"}`, 10, TILE_H + 8, 14);
          sctx.fillStyle = "#c9c4b8";
          sctx.fillRect(0, TILE_H, TILE_W, 1);
          strip.width = 0;
        }
        cells.forEach((cell, index) => {
          const x0 = (index % 2) * tw;
          const y0 = Math.floor(index / 2) * th;
          const name = (key) => (key === "mixBlue" ? "blue" : key);
          label(sctx, `${brushId}  ${cell.wet ? "wet" : "dry"}  ${name(cell.second)} over ${name(cell.first)}`, x0 + 10, y0 + 8, 14);
          const r = report[brushId][cell.key].overlapRect;
          sctx.strokeStyle = "rgba(0,0,0,.35)";
          sctx.lineWidth = 1;
          sctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w, r.h);
        });
        sctx.fillStyle = "#c9c4b8";
        sctx.fillRect(tw, 0, 1, TILE_H);
        sctx.fillRect(0, th, TILE_W, 1);
        emit(images, `mixing-${brushId}.png`, sheet);
        work.width = 0;
      }
      return { images, report, sampleFree, checks, ok: checks.every((c) => c.pass) };
    };

    // (c) SMUDGE (Stage 4): the three smudge renderers — the legacy square
    // (ops without `v`), v3 "drag" and v3 "blend" — side by side over the
    // same hard red|blue field: four horizontal passes across the boundary
    // at pressure 0.7 plus one diagonal with the lab's pressure ramp, size
    // 40, strength 0.6, a fresh renderer (stroke) per pass, one point per
    // addPoints call. Smudge paints DIRECTLY on layer 0 (the work canvas).
    // Gated (checks):
    //   edge — inside each horizontal pass's band, the largest colour step
    //     PERPENDICULAR to the motion (max channel |Δ| on white between
    //     vertically adjacent pixels — red #e04b2a and blue #1e88e5 are
    //     near-isoluminant, so luminance alone would be blind here): the
    //     legacy square leaves its box edges as hard steps; drag / blend
    //     must feather (max AND 99th-percentile step below legacy's) and
    //     show no 90-degree corner signature (pixels with a strong step
    //     both along AND across the motion — a square's edge meeting the
    //     field boundary — fewer than legacy's and at most a handful);
    //   carry — a drag stroke that starts inside a red field and runs 300
    //     px onto blank paper: its first ~4 dabs past the field read closer
    //     to red than to paper (colour travels with the finger), the last
    //     15% of the tail closer to paper (it thins out); blend must not
    //     carry (its tail is paper too);
    //   timing — ms per dab at 900x600 AND the real 4000x2500 layer, one
    //     1x1 fence per timed canvas, legacy / drag / blend at size 40 (the
    //     runner budgets drag / blend at 4000x2500 — the legacy column is
    //     the ~8 ms self-referential drawImage it replaces);
    //   determinism — rerun + batch 1 vs 7 per v3 mode, pixel-identical.
    const SMUDGE_MODES = ["legacy", "drag", "blend"];
    // Target drawImage calls per dab, per renderer — the engine contract the
    // timing's dab count is derived from: legacy re-stamps its square once,
    // drag lays the carry once, blend lays the blurred footprint once.
    const SMUDGE_TARGET_DRAWS = { legacy: 1, drag: 1, blend: 1 };
    const SMUDGE_SIZE = 40;
    const SMUDGE_STRENGTH = 0.6;
    const SMUDGE_PRESSURE = 0.7;
    const SMUDGE_CORNER_FLOOR = 12; // v3 corner px allowed (AA noise), on top of "< legacy"
    const SMUDGE_RED = [224, 75, 42];
    const PAPER = [255, 255, 255];
    const CARRY_FIELD = { x0: 60, x1: 300 }; // the red field of the carry strip; the stroke starts inside it
    const CARRY_TAIL = 300; // px of blank paper the carry stroke runs on for
    const CARRY_FIRST_DABS = 4;
    // Ops exactly as startStroke puts them on the wire (key order included):
    // legacy = no `v`; v3 = v:3 + smudgeMode.
    const smudgeSettingsFor = (mode, size = SMUDGE_SIZE, strength = SMUDGE_STRENGTH) => {
      const settings = { brush: "smudge", color: "#000000", size, opacity: 1, variation: 0, seed: SEED_A, strength };
      if (mode !== "legacy") {
        settings.v = 3;
        settings.smudgeMode = mode;
      }
      return settings;
    };
    const smudgeField = (ctx, boundary) => {
      ctx.fillStyle = COLORS.red;
      ctx.fillRect(60, 60, boundary - 60, TILE_H - 120);
      ctx.fillStyle = COLORS.mixBlue;
      ctx.fillRect(boundary, 60, boundary - 60, TILE_H - 120);
    };
    // Horizontal passes (x relative to the boundary), alternating direction.
    const SMUDGE_PASSES = [
      { y: 150, from: -160, to: 160 },
      { y: 250, from: 160, to: -160 },
      { y: 350, from: -160, to: 160 },
      { y: 450, from: 160, to: -160 },
    ];
    const smudgeStrokes = (boundary) => {
      const strokes = SMUDGE_PASSES.map((pass) => {
        const points = [];
        for (let i = 0; i < 120; i += 1) {
          const t = i / 119;
          points.push({ x: q4(boundary + pass.from + (pass.to - pass.from) * t), y: q4(pass.y + 6 * Math.sin(t * Math.PI * 4)), pressure: SMUDGE_PRESSURE });
        }
        return points;
      });
      const diagonal = [];
      for (let i = 0; i < 160; i += 1) {
        const t = i / 159;
        const p = t < 0.55 ? 0.15 + 0.85 * (t / 0.55) : 1 - 0.7 * ((t - 0.55) / 0.45);
        diagonal.push({ x: q4(boundary - 200 + 400 * t), y: q4(520 - 440 * t), pressure: Math.round(p * 1000) / 1000 });
      }
      strokes.push(diagonal);
      return strokes;
    };
    // Feed strokes the way every consumer does — `batch` points per
    // addPoints call (1 = the app, 7 = the wire's batches), a fresh
    // renderer per stroke. Legacy: the direct renderer on the work canvas
    // (layer 0). v3: the buffered path (makeStrokeEntryCore with the work
    // canvas as smudgeSource — its renderer samples the pre-stroke paper,
    // the buffer commits at pen-up), exactly like App / opReplay.
    const feedSmudge = (ctx, work, mode, strokes, batch = 1) => {
      let fed = 0;
      for (const points of strokes) {
        const settings = smudgeSettingsFor(mode);
        if (mode === "legacy") {
          const renderer = makeSmudgeRenderer(settings, work);
          for (let i = 0; i < points.length; i += batch) {
            renderer.addPoints(ctx, points.slice(i, i + batch));
          }
          renderer.end(ctx);
        } else {
          const { buf, renderer, fx, pad, opacity } = makeStrokeEntryCore(settings, undefined, { smudgeSource: work });
          for (let i = 0; i < points.length; i += batch) {
            const slice = points.slice(i, i + batch);
            for (const point of slice) {
              if (buf.ensure(point.x, point.y, pad).overflow) {
                prepareStrokeCommit(buf, renderer, fx, false);
                buf.commit(ctx, opacity);
                buf.reset();
                buf.ensure(point.x, point.y, pad);
              }
            }
            renderer.addPoints(buf.getCtx(), slice, buf.base());
          }
          prepareStrokeCommit(buf, renderer, fx);
          buf.commit(ctx, opacity);
          buf.dispose();
        }
        fed += points.length;
      }
      return fed;
    };
    // One timed stroke per renderer: legacy = the direct walk, fenced on
    // the target; v3 = the buffered walk into a PRE-SIZED buffer (no grow
    // inside the clock), fenced on the buffer, then the commit fenced on
    // the target. `count` wraps the drawing ctx in the Proxy (untimed run).
    const timeSmudgeStroke = (ctx, work, mode, points, count = false) => {
      const settings = smudgeSettingsFor(mode);
      if (mode === "legacy") {
        const renderer = makeSmudgeRenderer(settings, work);
        const target = count ? makeCountingCtx(ctx) : null;
        const t0 = performance.now();
        for (const point of points) renderer.addPoints(target ? target.proxy : ctx, [point]);
        flushGpu(ctx);
        return { addMs: performance.now() - t0, commitMs: 0, counts: target ? target.counts : null };
      }
      const { buf, renderer, fx, pad, opacity } = makeStrokeEntryCore(settings, undefined, { smudgeSource: work });
      for (const point of points) buf.ensure(point.x, point.y, pad);
      const base = buf.base();
      const target = count ? makeCountingCtx(buf.getCtx()) : null;
      const drawCtx = target ? target.proxy : buf.getCtx();
      const t0 = performance.now();
      for (const point of points) renderer.addPoints(drawCtx, [point], base);
      flushGpu(buf.getCtx());
      const t1 = performance.now();
      prepareStrokeCommit(buf, renderer, fx);
      buf.commit(ctx, opacity);
      flushGpu(ctx);
      const t2 = performance.now();
      buf.dispose();
      return { addMs: t1 - t0, commitMs: t2 - t1, counts: target ? target.counts : null };
    };
    const renderSmudgeTile = (mode, batch = 1) => {
      const work = makeCanvas(TILE_W, TILE_H);
      const ctx = work.getContext("2d");
      const boundary = TILE_W / 2;
      smudgeField(ctx, boundary);
      const t0 = performance.now();
      const fed = feedSmudge(ctx, work, mode, smudgeStrokes(boundary), batch);
      return { work, fed, ms: performance.now() - t0 };
    };
    // Colour steps on white inside a rect: max channel |Δ| to the pixel
    // below (ACROSS a horizontal pass's motion) and to the right (along it).
    // A "corner" pixel has both above `T`.
    const edgeStats = (canvas, rect, T = 40) => {
      const rgb = onWhiteBytes(canvas.getContext("2d"), rect);
      const w = rect.w;
      const at = (x, y) => (y * w + x) * 3;
      const step = (i, j) => Math.max(Math.abs(rgb[i] - rgb[j]), Math.abs(rgb[i + 1] - rgb[j + 1]), Math.abs(rgb[i + 2] - rgb[j + 2]));
      const across = [];
      let corners = 0;
      for (let y = 0; y < rect.h - 1; y += 1) {
        for (let x = 0; x < w - 1; x += 1) {
          const i = at(x, y);
          const dy = step(i, at(x, y + 1));
          const dx = step(i, at(x + 1, y));
          across.push(dy);
          if (dy > T && dx > T) corners += 1;
        }
      }
      across.sort((a, b) => a - b);
      return { maxAcross: across[across.length - 1], p99Across: across[Math.floor(across.length * 0.99)], corners };
    };
    // The bands of the four horizontal passes: ±32 rows around each pass
    // (dab radius ~15 + the 6-px wobble + the feather), the middle 240
    // columns (clear of the passes' ends, whose leading edges run ACROSS
    // the motion by design).
    const smudgeEdgeReport = (canvas, boundary) => {
      const out = { maxAcross: 0, p99Across: 0, corners: 0 };
      for (const pass of SMUDGE_PASSES) {
        const s = edgeStats(canvas, { x: boundary - 120, y: pass.y - 32, w: 240, h: 64 });
        out.maxAcross = Math.max(out.maxAcross, s.maxAcross);
        out.p99Across = Math.max(out.p99Across, s.p99Across);
        out.corners += s.corners;
      }
      return out;
    };
    // The carry strip: a red field, one straight stroke from inside it to
    // CARRY_TAIL px past its edge. Band means on white just past the field
    // (the first CARRY_FIRST_DABS dabs) and over the last 15% of the tail.
    const renderCarryStrip = (mode) => {
      const strip = makeCanvas(TILE_W, TILE_H / 2);
      const ctx = strip.getContext("2d");
      const y = TILE_H / 4;
      ctx.fillStyle = COLORS.red;
      ctx.fillRect(CARRY_FIELD.x0, y - 100, CARRY_FIELD.x1 - CARRY_FIELD.x0, 200);
      const x1 = CARRY_FIELD.x1 + CARRY_TAIL;
      const points = [];
      for (let i = 0; i < 400; i += 1) {
        const t = i / 399;
        points.push({ x: q4(120 + (x1 - 120) * t), y: q4(y), pressure: SMUDGE_PRESSURE });
      }
      feedSmudge(ctx, strip, mode, [points]);
      // Dab geometry at pressure 0.7 — the engine's numbers (minSize 0.3,
      // pressure^1.35, spacing 0.18 drag / 0.22 blend).
      const dabPx = SMUDGE_SIZE * (0.3 + 0.7 * Math.pow(SMUDGE_PRESSURE, 1.35));
      const step = (mode === "blend" ? 0.22 : 0.18) * dabPx;
      const band = (x, w) => ({ x: Math.round(x), y: Math.round(y - dabPx / 4), w: Math.max(1, Math.round(w)), h: Math.round(dabPx / 2) });
      const first = meanOnWhite(strip, band(CARRY_FIELD.x1 + 1, CARRY_FIRST_DABS * step));
      const last = meanOnWhite(strip, band(x1 - CARRY_TAIL * 0.15, CARRY_TAIL * 0.15 - 2));
      return {
        strip,
        firstMeanRgb: first,
        lastMeanRgb: last,
        firstToRed: rgbDistance(first, SMUDGE_RED),
        firstToPaper: rgbDistance(first, PAPER),
        lastToRed: rgbDistance(last, SMUDGE_RED),
        lastToPaper: rgbDistance(last, PAPER),
        firstBandPx: Math.round(CARRY_FIRST_DABS * step),
        tailPx: CARRY_TAIL,
      };
    };
    // Per-dab cost per renderer at both canvas sizes: a 700-px, 600-point
    // stroke through a red|blue band, `runs` fenced runs (median), then ONE
    // untimed Proxy-counted run for the dab count (target drawImage calls ÷
    // SMUDGE_TARGET_DRAWS). Fresh canvas per run — one fence per canvas.
    const smudgeTiming = ({ runs = 3 } = {}) => {
      const dims = [
        { key: "900x600", w: TILE_W, h: TILE_H },
        { key: "4000x2500", w: CANVAS_WIDTH, h: CANVAS_HEIGHT },
      ];
      const out = {};
      for (const d of dims) {
        out[d.key] = {};
        const cx = d.w / 2;
        const cy = d.h / 2;
        const points = [];
        for (let i = 0; i < STROKE_POINTS; i += 1) {
          const t = i / (STROKE_POINTS - 1);
          points.push({ x: q4(cx - 350 + 700 * t), y: q4(cy + 20 * Math.sin(t * Math.PI * 3)), pressure: SMUDGE_PRESSURE });
        }
        const paintUnder = (ctx) => {
          ctx.fillStyle = COLORS.red;
          ctx.fillRect(cx - 400, cy - 80, 400, 160);
          ctx.fillStyle = COLORS.mixBlue;
          ctx.fillRect(cx, cy - 80, 400, 160);
        };
        for (const mode of SMUDGE_MODES) {
          const times = [];
          const commits = [];
          for (let run = 0; run < runs; run += 1) {
            const work = makeCanvas(d.w, d.h);
            const ctx = work.getContext("2d");
            paintUnder(ctx);
            const r = timeSmudgeStroke(ctx, work, mode, points);
            times.push(r.addMs);
            commits.push(r.commitMs);
            work.width = 0;
          }
          const work = makeCanvas(d.w, d.h);
          const ctx = work.getContext("2d");
          paintUnder(ctx);
          const { counts } = timeSmudgeStroke(ctx, work, mode, points, true);
          work.width = 0;
          const dabs = counts.drawImage / SMUDGE_TARGET_DRAWS[mode];
          const ms = median(times);
          out[d.key][mode] = {
            msMedian: +ms.toFixed(2),
            msRuns: times.map((v) => +v.toFixed(2)),
            commitMsMedian: +median(commits).toFixed(2),
            dabs,
            msPerDab: dabs > 0 ? +(ms / dabs).toFixed(4) : null,
            targetDraws: counts.drawImage,
            saveCalls: counts.save,
            getImageDataOnDrawPath: counts.getImageData,
          };
        }
      }
      return out;
    };
    const smudgeDeterminism = () => {
      const report = {};
      let ok = true;
      for (const mode of ["drag", "blend"]) {
        const a = renderSmudgeTile(mode, 1).work;
        const b = renderSmudgeTile(mode, 1).work;
        const c = renderSmudgeTile(mode, 7).work;
        const rerun = comparePixels(a, b);
        const batching = comparePixels(a, c);
        report[mode] = { rerunIdentical: rerun.identical, batchIdentical: batching.identical, rerun, batching, paintedPixels: pixelStats(a).painted };
        if (!rerun.identical || !batching.identical) ok = false;
        [a, b, c].forEach((cv) => { cv.width = 0; });
      }
      return { report, ok };
    };
    const scenarioSmudge = ({ runs = 3 }) => {
      const boundary = TILE_W / 2;
      const band = { x: boundary - 40, y: 100, w: 80, h: 400 };
      const images = [];
      const checks = [];
      const check = (name, pass, detail) => {
        checks.push({ name, pass, detail });
        return pass;
      };
      const reference = makeCanvas(TILE_W, TILE_H);
      smudgeField(reference.getContext("2d"), boundary);
      const before = meanOnWhite(reference, band);
      reference.width = 0;
      const modes = {};
      const tiles = {};
      for (const mode of SMUDGE_MODES) {
        const { work, fed, ms } = renderSmudgeTile(mode);
        const ctx = work.getContext("2d");
        // Stage-0 number, kept: columns near the boundary (row 150 ± 2)
        // whose colour is neither the pure red nor the pure blue.
        const rowData = ctx.getImageData(boundary - 120, 148, 240, 5).data;
        let blendedColumns = 0;
        for (let col = 0; col < 240; col += 1) {
          let r = 0;
          let b = 0;
          for (let row = 0; row < 5; row += 1) {
            const i = (row * 240 + col) * 4;
            r += rowData[i];
            b += rowData[i + 2];
          }
          r /= 5;
          b /= 5;
          if (r > 40 && b > 40 && Math.abs(r - b) < 180) blendedColumns += 1;
        }
        modes[mode] = {
          pointsFed: fed,
          ms: +ms.toFixed(2),
          boundaryMeanAfter: meanOnWhite(work, band),
          blendedColumnsAtRow150: blendedColumns,
          edge: smudgeEdgeReport(work, boundary),
        };
        tiles[mode] = work;
      }
      const legacyEdge = modes.legacy.edge;
      for (const mode of ["drag", "blend"]) {
        const e = modes[mode].edge;
        check(`${mode} noHardEdge`, e.maxAcross < legacyEdge.maxAcross && e.p99Across < legacyEdge.p99Across, `max step across the motion ${e.maxAcross} (p99 ${e.p99Across}) vs legacy ${legacyEdge.maxAcross} (p99 ${legacyEdge.p99Across})`);
        check(`${mode} noCorners`, e.corners < legacyEdge.corners && e.corners <= SMUDGE_CORNER_FLOOR, `${e.corners} corner px vs legacy ${legacyEdge.corners} (allowed <= ${SMUDGE_CORNER_FLOOR})`);
      }
      const carry = {};
      const strips = {};
      for (const mode of ["drag", "blend"]) {
        const { strip, ...r } = renderCarryStrip(mode);
        strips[mode] = strip;
        carry[mode] = r;
        if (mode === "drag") {
          check("drag carryTravels", r.firstToRed < r.firstToPaper, `first ${CARRY_FIRST_DABS} dabs (${r.firstBandPx}px) past the field [${r.firstMeanRgb}]: ${r.firstToRed} from red, ${r.firstToPaper} from paper`);
          check("drag carryThinsOut", r.lastToPaper < r.lastToRed, `last 15% of the ${CARRY_TAIL}px tail [${r.lastMeanRgb}]: ${r.lastToPaper} from paper, ${r.lastToRed} from red`);
        } else {
          check("blend noCarry", r.lastToPaper < r.lastToRed, `last 15% of the ${CARRY_TAIL}px tail [${r.lastMeanRgb}]: ${r.lastToPaper} from paper, ${r.lastToRed} from red`);
        }
      }
      const timing = smudgeTiming({ runs });
      const determinism = smudgeDeterminism();
      check("determinism", determinism.ok, Object.entries(determinism.report).map(([m, d]) => `${m}: rerun=${d.rerunIdentical} batch=${d.batchIdentical}`).join(", "));
      // Sheet: row 1 = legacy | drag | blend tiles; row 2 = the drag | blend carry strips.
      const stripH = TILE_H / 2;
      const sheet = makeCanvas(TILE_W * 3, TILE_H + stripH);
      const sctx = sheet.getContext("2d");
      sctx.fillStyle = "#ffffff";
      sctx.fillRect(0, 0, sheet.width, sheet.height);
      SMUDGE_MODES.forEach((mode, index) => {
        sctx.drawImage(tiles[mode], index * TILE_W, 0);
        const e = modes[mode].edge;
        label(sctx, `smudge ${mode}  size ${SMUDGE_SIZE}  strength ${SMUDGE_STRENGTH}  pressure ${SMUDGE_PRESSURE}  —  edge step max ${e.maxAcross} p99 ${e.p99Across}, corners ${e.corners}`, index * TILE_W + 12, 10, 14);
        tiles[mode].width = 0;
      });
      ["drag", "blend"].forEach((mode, index) => {
        sctx.drawImage(strips[mode], index * TILE_W, TILE_H);
        const r = carry[mode];
        label(sctx, `${mode}  from a red field onto ${CARRY_TAIL}px of paper  →  first ${CARRY_FIRST_DABS} dabs [${r.firstMeanRgb}]  last 15% [${r.lastMeanRgb}]`, index * TILE_W + 12, TILE_H + 8, 14);
        strips[mode].width = 0;
      });
      sctx.fillStyle = "#c9c4b8";
      sctx.fillRect(TILE_W, 0, 1, sheet.height);
      sctx.fillRect(TILE_W * 2, 0, 1, sheet.height);
      sctx.fillRect(0, TILE_H, sheet.width, 1);
      emit(images, "smudge.png", sheet);
      return {
        images,
        report: { boundaryMeanBefore: before, modes, carry, timing, determinism: determinism.report, checks },
        ok: checks.every((c) => c.pass),
      };
    };

    // (d) DETERMINISM: same seed + same points through two fresh renderers
    // (the app's per-point flow) must be pixel-identical; so must batch-1 vs
    // batch-7 point feeding. The batching pair is rendered into PRE-SIZED
    // buffers so only the renderer walk varies: a mid-stroke buffer grow
    // drawImage-copies the old canvas, and that copy is not pixel-lossless on
    // anti-aliased edges (measured: a few px, tiny deltas), and batching moves
    // the grow relative to the dabs. The app's consumers all ensure() per
    // point, so they share one grow history — that lossiness is reported
    // separately as `growCopy` (informational, not a failure).
    const scenarioDeterminism = ({ brushes, size = 32 }) => {
      const report = {};
      let allIdentical = true;
      for (const brushId of brushes) {
        const render = (batch, preEnsure) => {
          const work = makeCanvas(TILE_W, TILE_H);
          paintStroke(work.getContext("2d"), brushId, makeStroke(), { color: COLORS.blue, size, seed: SEED_A, batch, preEnsure });
          return work;
        };
        const one = render(1, false);
        const two = render(1, false);
        const onePre = render(1, true);
        const sevenPre = render(7, true);
        const rerun = comparePixels(one, two);
        const batching = comparePixels(onePre, sevenPre);
        const growCopy = comparePixels(one, onePre);
        const painted = pixelStats(one).painted;
        report[brushId] = {
          rerunIdentical: rerun.identical,
          batchIdentical: batching.identical,
          rerun,
          batching,
          growCopy: { lossless: growCopy.identical, differingPixels: growCopy.differingPixels, maxChannelDelta: growCopy.maxChannelDelta, maxVisibleDelta: growCopy.maxVisibleDelta },
          paintedPixels: painted,
        };
        if (!rerun.identical || !batching.identical || painted === 0) allIdentical = false;
        [one, two, onePre, sevenPre].forEach((c) => { c.width = 0; });
        // Stage 3: the same pair with the km path ACTIVE — a committed
        // under-stroke + mix map, then the tested stroke wet (pickup) or dry
        // (mix) over it, so its dabs sample and mix. The under-stroke is dry
        // and deterministic, so only the km walk varies.
        const km = kmParams(brushId);
        if (km) {
          const wet = km.wet;
          const renderKm = (batch, preEnsure) => {
            const work = makeCanvas(TILE_W, TILE_H);
            const ctx = work.getContext("2d");
            const mix = createMixMap(() => work, work.width, work.height);
            paintStroke(ctx, brushId, makeStroke({ flip: true }), { color: COLORS.mixBlue, size, seed: SEED_B, mix });
            paintStroke(ctx, brushId, makeStroke(), { color: COLORS.yellow, size, seed: SEED_A, wet, mix, batch, preEnsure });
            return work;
          };
          const kOne = renderKm(1, false);
          const kTwo = renderKm(1, false);
          const kOnePre = renderKm(1, true);
          const kSevenPre = renderKm(7, true);
          const kRerun = comparePixels(kOne, kTwo);
          const kBatching = comparePixels(kOnePre, kSevenPre);
          report[brushId].km = { wet, rerunIdentical: kRerun.identical, batchIdentical: kBatching.identical, rerun: kRerun, batching: kBatching };
          if (!kRerun.identical || !kBatching.identical) allIdentical = false;
          [kOne, kTwo, kOnePre, kSevenPre].forEach((c) => { c.width = 0; });
        }
      }
      return { images: [], report, ok: allIdentical };
    };

    // (e) TIMING: 5 runs of the 600-point stroke per brush/size (median ms,
    // plain ctx — no Proxy in the timed runs), commit timed separately, then
    // ONE extra counted run through the Proxy for raster-op totals. Dabs are
    // estimated from ops ÷ ops-per-dab, where ops-per-dab is calibrated from
    // isolated single-point taps (the engine contract: a first point stamps
    // exactly one dab). Per-dab op counts vary for fleck shapes, so it's a
    // mean, not an exact count.
    const KM_RUNS = 7; // interleaved blank / solid / gradient iterations for the km delta
    // A ctx that does nothing: every method is a no-op, every property write
    // is accepted. The renderer's walk + colour maths run in full against it
    // (it never reads the ctx back when handed a `base`), so a walk against
    // it times the CPU side of the dab path alone.
    const NOOP = () => {};
    const NOOP_CTX = new Proxy({}, { get: () => NOOP, set: () => true });
    const scenarioTiming = ({ brushes, sizes = [32, 80], runs = 5 }) => {
      const report = {};
      const points = makeStroke();
      for (const brushId of brushes) {
        report[brushId] = {};
        for (const size of sizes) {
          const addTimes = [];
          const commitTimes = [];
          for (let run = 0; run < runs; run += 1) {
            const work = makeCanvas(TILE_W, TILE_H);
            const r = paintStroke(work.getContext("2d"), brushId, points, { color: COLORS.blue, size, seed: SEED_A });
            addTimes.push(r.addMs);
            commitTimes.push(r.commitMs);
            work.width = 0;
          }
          const work = makeCanvas(TILE_W, TILE_H);
          const counted = paintStroke(work.getContext("2d"), brushId, points, { color: COLORS.blue, size, seed: SEED_A, count: true });
          work.width = 0;
          // Calibration: 24 isolated taps → mean ops per single dab.
          let tapOps = 0;
          const taps = 24;
          for (let i = 0; i < taps; i += 1) {
            const tapCanvas = makeCanvas(256, 256);
            const r = paintStroke(tapCanvas.getContext("2d"), brushId, [{ x: 100 + i * 3.25, y: 90 + (i % 5) * 7.5, pressure: 0.6 }], { color: COLORS.blue, size, seed: SEED_A + i, count: true });
            tapOps += r.counts.ops;
            tapCanvas.width = 0;
          }
          const opsPerDab = tapOps / taps;
          const dabsEst = opsPerDab > 0 ? counted.counts.ops / opsPerDab : 0;
          const addMedian = median(addTimes);
          // Stage 3: the same stroke with the km path sampling on EVERY dab —
          // over a solid under-fill (the typical case: crossing a stroke, the
          // carry settles, few colour-bucket changes) and over a gradient
          // (the worst case: the bucket changes every few dabs, so the tint
          // ring re-tints and the ribbon strings rebuild). The mix map is
          // prefetched (flush) first, like the app's idle prefetch, so the
          // delta is per-dab cost only. Dry (mix) unless the brush only picks
          // up wet.
          let km = null;
          const params = kmParams(brushId);
          if (params) {
            const wet = !params.dry;
            // Interleaved runs — blank / solid / gradient per iteration — so
            // a machine-state drift between separate loops can't read as a
            // km cost (the software rasteriser drifts by more than the budget
            // between loops); best-of-N per case, KM_RUNS iterations.
            const blank = [];
            const solid = [];
            const gradient = [];
            const timeOver = (paintUnder) => {
              const work = makeCanvas(TILE_W, TILE_H);
              const ctx = work.getContext("2d");
              let mix = null;
              if (paintUnder) {
                paintUnder(ctx);
                mix = createMixMap(() => work, work.width, work.height);
                mix.flush();
              }
              const r = paintStroke(ctx, brushId, points, { color: COLORS.blue, size, seed: SEED_A, wet: mix ? wet : false, mix });
              work.width = 0;
              return r.addMs;
            };
            const fillSolid = (ctx) => {
              ctx.fillStyle = COLORS.yellow;
              ctx.fillRect(0, 0, TILE_W, TILE_H);
            };
            const fillGradient = (ctx) => {
              const g = ctx.createLinearGradient(0, 0, TILE_W, TILE_H);
              g.addColorStop(0, COLORS.yellow);
              g.addColorStop(0.5, COLORS.red);
              g.addColorStop(1, COLORS.mixBlue);
              ctx.fillStyle = g;
              ctx.fillRect(0, 0, TILE_W, TILE_H);
            };
            for (let run = 0; run < KM_RUNS; run += 1) {
              blank.push(timeOver(null));
              solid.push(timeOver(fillSolid));
              gradient.push(timeOver(fillGradient));
            }
            const per100 = (ms) => (dabsEst > 0 ? +((ms / dabsEst) * 100).toFixed(3) : null);
            // The km CPU cost on its own: the same dab walk against a no-op
            // ctx (nothing rasterises), with and without a sampling mix map.
            // What is left is exactly what Stage 3 added per dab — the mix
            // (3 mixLatent + latentToRgb), the bucket bookkeeping and the
            // odd tint-ring re-tint on a bucket change — free of the raster
            // clock, whose run-to-run swing on either renderer is several
            // times this budget. Interleaved, best-of-KM_RUNS. This is the
            // number the KM budget gates on; the raster deltas above are
            // reported for context.
            const cpuNoMix = [];
            const cpuMix = [];
            const walkCpu = (withMix) => {
              const work = makeCanvas(TILE_W, TILE_H);
              const ctx = work.getContext("2d");
              let mix = null;
              if (withMix) {
                fillSolid(ctx);
                mix = createMixMap(() => work, work.width, work.height);
                mix.flush();
              }
              const { settings } = makeSettings(brushId, { color: COLORS.blue, size, seed: SEED_A, wet: withMix ? wet : false });
              const { buf, renderer, pad } = makeStrokeEntryCore(settings, mix ? mix.sample : undefined);
              for (const point of points) buf.ensure(point.x, point.y, pad);
              const base = buf.base();
              const t0 = performance.now();
              for (const point of points) renderer.addPoints(NOOP_CTX, [point], base);
              const ms = performance.now() - t0;
              buf.dispose();
              work.width = 0;
              return ms;
            };
            for (let run = 0; run < KM_RUNS; run += 1) {
              cpuNoMix.push(walkCpu(false));
              cpuMix.push(walkCpu(true));
            }
            km = {
              wet,
              runs: KM_RUNS,
              cpuMsNoMix: +Math.min(...cpuNoMix).toFixed(3),
              cpuMsMix: +Math.min(...cpuMix).toFixed(3),
              cpuDeltaPer100Dabs: per100(Math.min(...cpuMix) - Math.min(...cpuNoMix)),
              addMsMedianBlank: +median(blank).toFixed(2),
              addMsMedianSolid: +median(solid).toFixed(2),
              addMsMedianGradient: +median(gradient).toFixed(2),
              addMsMinBlank: +Math.min(...blank).toFixed(2),
              addMsMinSolid: +Math.min(...solid).toFixed(2),
              addMsMinGradient: +Math.min(...gradient).toFixed(2),
              // Deltas from the best-of-N runs: a cost measure that a slow
              // outlier run can't inflate.
              deltaPer100DabsSolid: per100(Math.min(...solid) - Math.min(...blank)),
              deltaPer100DabsGradient: per100(Math.min(...gradient) - Math.min(...blank)),
              deltaPer100DabsSolidMedian: per100(median(solid) - median(blank)),
            };
          }
          report[brushId][size] = {
            addMsMedian: +addMedian.toFixed(2),
            addMsRuns: addTimes.map((v) => +v.toFixed(2)),
            km,
            commitMsMedian: +median(commitTimes).toFixed(2),
            ops: counted.counts.ops,
            opsBreakdown: { fill: counted.counts.fill, stroke: counted.counts.stroke, drawImage: counted.counts.drawImage, fillRect: counted.counts.fillRect },
            getImageDataOnDrawPath: counted.counts.getImageData,
            saveCalls: counted.counts.save,
            opsPerDab: +opsPerDab.toFixed(2),
            dabsEst: Math.round(dabsEst),
            msPer100Dabs: dabsEst > 0 ? +((addMedian / dabsEst) * 100).toFixed(3) : null,
            usPerOp: counted.counts.ops > 0 ? +((addMedian * 1000) / counted.counts.ops).toFixed(2) : null,
            countedRunMs: +counted.addMs.toFixed(2),
          };
        }
      }
      return { images: [], report };
    };

    // (f) CONTACT SHEET: one size-32 blue stroke per brush, name under it.
    const scenarioContact = ({ brushes, size = 32 }) => {
      const cellW = 300;
      const cellH = 200;
      const cols = Math.min(5, brushes.length);
      const rows = Math.ceil(brushes.length / cols);
      const sheet = makeCanvas(cellW * cols, cellH * rows);
      const sctx = sheet.getContext("2d");
      sctx.fillStyle = "#ffffff";
      sctx.fillRect(0, 0, sheet.width, sheet.height);
      const work = makeCanvas(sheet.width, sheet.height);
      const wctx = work.getContext("2d");
      const report = {};
      brushes.forEach((brushId, index) => {
        const x0 = (index % cols) * cellW;
        const y0 = Math.floor(index / cols) * cellH;
        const box = { x0: x0 + 10, y0: y0 + 10, w: cellW - 20, h: cellH - 60 };
        const r = paintStroke(wctx, brushId, makeStroke(box), { color: COLORS.blue, size, seed: SEED_A });
        report[brushId] = { addMs: +r.addMs.toFixed(2), coverage: +pixelStats(work, { x: x0, y: y0, w: cellW, h: cellH }).coverage.toFixed(4) };
      });
      sctx.drawImage(work, 0, 0);
      work.width = 0;
      brushes.forEach((brushId, index) => {
        const x0 = (index % cols) * cellW;
        const y0 = Math.floor(index / cols) * cellH;
        const entry = brushCatalog.find((b) => b.id === brushId);
        label(sctx, `${entry?.name || brushId}  (${brushId})`, x0 + 12, y0 + cellH - 38, 15);
        sctx.fillStyle = "#c9c4b8";
        sctx.fillRect(x0, y0 + cellH - 1, cellW, 1);
        sctx.fillRect(x0 + cellW - 1, y0, 1, cellH);
      });
      const images = [];
      emit(images, "contact-sheet.png", sheet);
      return { images, report };
    };

    // (g) GOLDEN: replay the frozen op fixture (scripts/lab/golden-ops.json,
    // built by make-golden-ops.mjs) group by group through
    // opReplay.replayFrameOnto — the film-export / spectator consumer, with
    // its own fresh mix map and per-stroke buffers per call — onto ONE reused
    // transparent 4000x2500 world canvas (replayFrameOnto clears it), and
    // SHA-256 the full RGBA readback. Each group replays `runs` times so an
    // intra-run wobble shows up as `stable: false` before anyone compares
    // against golden.json. The runner does the comparing; this just hashes.
    const hashCanvas = async (canvas) => {
      const data = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data;
      let painted = 0;
      for (let i = 3; i < data.length; i += 4) {
        if (data[i] > 0) painted += 1;
      }
      const digest = await crypto.subtle.digest("SHA-256", data);
      const hex = Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, "0")).join("");
      return { hex, painted };
    };

    const loadFixture = async () => {
      const res = await fetch("/scripts/lab/golden-ops.json", { cache: "no-store" });
      if (!res.ok) {
        throw new Error(`golden-ops.json: HTTP ${res.status} — run node scripts/lab/make-golden-ops.mjs`);
      }
      return res.json();
    };

    const scenarioGolden = async ({ groups: wanted, fixture, runs = 2, previews = true }) => {
      const data = fixture || (await loadFixture());
      if (data.canvas.width !== CANVAS_WIDTH || data.canvas.height !== CANVAS_HEIGHT) {
        throw new Error(`fixture canvas ${data.canvas.width}x${data.canvas.height} ≠ engine ${CANVAS_WIDTH}x${CANVAS_HEIGHT}`);
      }
      const images = [];
      const report = {};
      const world = makeCanvas(CANVAS_WIDTH, CANVAS_HEIGHT);
      for (const group of data.groups) {
        if (wanted && wanted.length && !wanted.includes(group.name)) {
          continue;
        }
        status.textContent = `golden: replaying ${group.name} (${group.ops.length} ops)…`;
        const hashes = [];
        let painted = 0;
        let replayMs = 0;
        for (let run = 0; run < runs; run += 1) {
          const t0 = performance.now();
          await replayFrameOnto(world, group.ops);
          replayMs += performance.now() - t0;
          const h = await hashCanvas(world);
          hashes.push(h.hex);
          painted = h.painted;
        }
        report[group.name] = {
          hash: hashes[0],
          hashes,
          stable: hashes.every((h) => h === hashes[0]),
          deterministic: group.deterministic !== false,
          machineBound: !!group.machineBound,
          note: group.note || "",
          ops: group.ops.length,
          painted,
          replayMs: +(replayMs / runs).toFixed(1),
        };
        if (previews) {
          // 1/4-scale on white for the eyeball — the hash is on the full canvas.
          const sheet = makeCanvas(CANVAS_WIDTH / 4, CANVAS_HEIGHT / 4);
          const sctx = sheet.getContext("2d");
          sctx.fillStyle = "#ffffff";
          sctx.fillRect(0, 0, sheet.width, sheet.height);
          sctx.drawImage(world, 0, 0, sheet.width, sheet.height);
          label(sctx, `golden ${group.name}  ${hashes[0].slice(0, 12)}${group.deterministic === false ? "  (nondeterministic)" : ""}`, 10, 8, 14);
          emit(images, `golden-${group.name}.png`, sheet);
        }
      }
      world.width = 0;
      return { images, report, fixture: { schema: data.schema, seed: data.seed, canvas: data.canvas, groups: data.groups.map((g) => g.name) } };
    };


    // (g) MIX PREFETCH: App.jsx prefetches the wet-mix mirror refresh in idle
    // time after a commit; every other consumer (history replay, spectators,
    // the other clients) flushes lazily inside sample(). The two must read
    // the same bytes at the same op-order points (P5), and layer 0 has
    // writers that never markDirty (eraser / smudge / shape / text draw the
    // layer directly) — so the map keeps a ledger of what its prefetches read
    // and invalidatePrefetch() (called by App at every unmarked write) hands
    // it back. One op script, rendered three ways:
    //   lazy     — markDirty after commits, sample() flushes (opReplay);
    //   prefetch — + mix.flush() after every commit (the idle prefetch) and
    //              mix.invalidatePrefetch() after every unmarked write (App);
    //   naive    — flush after every commit, never invalidate (the bug).
    // Script A: dry blue stroke, eraser straight through it (direct, unmarked),
    // wet yellow stroke along the same path. A wet dab over the erased stretch
    // must see paper (the lazy map re-reads after the eraser); a prefetch that
    // read before the eraser still sees blue. prefetch must hash-equal lazy,
    // and naive must differ (proof the case has teeth).
    // Script B: dry blue, a wet stroke (its first dab is the lazy flush
    // point), eraser, a second wet stroke over the erased stretch. The lazy
    // mirror is stale there by design (no mark, no re-read), and the ledger
    // must NOT re-dirty past a sample — prefetch must still equal lazy.
    // What is compared: the SAMPLE SEQUENCE every variant's dabs read (P5's
    // actual invariant — the same bytes at the same op-order points) and the
    // pixels. On the GPU renderer a readback (the prefetch's flush draws
    // layer 0 into the mirror) can leave a ±1 rounding wobble on a couple
    // of pixels of the strokes that follow — raster noise, not op order —
    // so there, identical samples with a <= 1-unit visible pixel delta still
    // count as equivalent; the software renderer (golden's) must be exact.
    // Teeth = the naive prefetch READS different bytes than lazy on A.
    const WET_BRUSHES = ["oil", "acrylic", "watercolor", "gouache"]; // WET_PICKUP > 0
    const ERASER = { brush: "eraser", size: 90, opacity: 1, variation: 0 }; // variation 0: no dice
    const fnv = (values) => {
      let h = 2166136261;
      for (const v of values) {
        h ^= v;
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0).toString(16).padStart(8, "0");
    };
    const scenarioMixPrefetch = async ({ brushes, size = 48, gpu = false }) => {
      const wanted = WET_BRUSHES.filter((id) => brushes.includes(id));
      const eraserLine = () => {
        const points = [];
        for (let i = 0; i <= 40; i += 1) {
          points.push({ x: q4(TILE_W * (0.05 + 0.9 * (i / 40))), y: q4(TILE_H * 0.5), pressure: 0.8 });
        }
        return points;
      };
      const scripts = {
        A: [
          { op: "stroke", color: COLORS.mixBlue, seed: SEED_A, points: makeStroke() },
          { op: "erase", points: eraserLine() },
          { op: "stroke", color: COLORS.yellow, seed: SEED_B, wet: true, points: makeStroke() },
        ],
        B: [
          { op: "stroke", color: COLORS.mixBlue, seed: SEED_A, points: makeStroke() },
          { op: "stroke", color: COLORS.yellow, seed: SEED_B, wet: true, points: makeStroke({ flip: true }) },
          { op: "erase", points: eraserLine() },
          { op: "stroke", color: COLORS.red, seed: SEED_A, wet: true, points: makeStroke() },
        ],
      };
      const variants = {
        lazy: { flush: false, invalidate: false },
        prefetch: { flush: true, invalidate: true },
        naive: { flush: true, invalidate: false },
      };
      const render = (brushId, script, variant) => {
        const work = makeCanvas(TILE_W, TILE_H);
        const ctx = work.getContext("2d");
        const mix = createMixMap(() => work, work.width, work.height); // this canvas plays layer 0
        // Every byte the dabs read, in order (null = 0, a colour = rgb + 1).
        const samples = [];
        const sampler = {
          ...mix,
          sample: (x, y) => {
            const s = mix.sample(x, y);
            samples.push(s ? ((s[0] << 16) | (s[1] << 8) | s[2]) + 1 : 0);
            return s;
          },
        };
        for (const step of script) {
          if (step.op === "stroke") {
            // paintStroke commits + markDirty, like App / opReplay.
            paintStroke(ctx, brushId, step.points, { color: step.color, size, seed: step.seed, wet: !!step.wet, mix: sampler });
            if (variant.flush) mix.flush(); // App's idle prefetch (pen up)
          } else if (step.op === "erase") {
            let last = step.points[0];
            for (const point of step.points) {
              drawBrushSegment(ctx, last, point, ERASER); // direct, unmarked
              last = point;
            }
            if (variant.invalidate) mix.invalidatePrefetch(); // App's unmarked-write hook
          }
        }
        return { work, sampleKey: `${samples.length}:${fnv(samples)}`, nonNull: samples.filter((s) => s !== 0).length };
      };
      const images = [];
      const report = {};
      let ok = wanted.length > 0;
      for (const brushId of wanted) {
        report[brushId] = {};
        for (const [name, script] of Object.entries(scripts)) {
          const rendered = {};
          const hashes = {};
          const sampleKeys = {};
          let nonNull = 0;
          for (const [variantName, variant] of Object.entries(variants)) {
            const r = render(brushId, script, variant);
            rendered[variantName] = r.work;
            sampleKeys[variantName] = r.sampleKey;
            if (variantName === "lazy") nonNull = r.nonNull;
            hashes[variantName] = (await hashCanvas(r.work)).hex;
          }
          const samplesEquivalent = sampleKeys.prefetch === sampleKeys.lazy;
          const pixels = comparePixels(rendered.lazy, rendered.prefetch);
          const equivalent = samplesEquivalent && (pixels.identical || (gpu && pixels.maxVisibleDelta <= 1));
          const teeth = name === "A" ? sampleKeys.naive !== sampleKeys.lazy : null;
          report[brushId][name] = {
            equivalent,
            samplesEquivalent,
            samplesNonNull: nonNull,
            pixelDiff: { differingPixels: pixels.differingPixels, maxVisibleDelta: pixels.maxVisibleDelta, toleratedGpuWobble: !pixels.identical && equivalent },
            teeth,
            hashes: Object.fromEntries(Object.entries(hashes).map(([k, v]) => [k, v.slice(0, 12)])),
            sampleKeys,
          };
          if (!equivalent || teeth === false) ok = false;
          if (name === "A") {
            // Eyeball sheet: lazy | prefetch | naive, 1/2 scale on white.
            const sheet = makeCanvas(TILE_W * 1.5, TILE_H / 2 + 24);
            const sctx = sheet.getContext("2d");
            sctx.fillStyle = "#ffffff";
            sctx.fillRect(0, 0, sheet.width, sheet.height);
            Object.entries(rendered).forEach(([variantName, work], index) => {
              sctx.drawImage(work, index * (TILE_W / 2), 24, TILE_W / 2, TILE_H / 2);
              label(sctx, `${brushId}  ${variantName}  ${hashes[variantName].slice(0, 12)}`, index * (TILE_W / 2) + 8, 4, 14);
            });
            emit(images, `mixprefetch-${brushId}.png`, sheet);
          }
          Object.values(rendered).forEach((c) => { c.width = 0; });
        }
      }
      return { images, report, ok };
    };

    const SCENARIOS = {
      strokes: scenarioStrokes,
      mixing: scenarioMixing,
      smudge: scenarioSmudge,
      determinism: scenarioDeterminism,
      timing: scenarioTiming,
      contact: scenarioContact,
      mixPrefetch: scenarioMixPrefetch,
      golden: scenarioGolden,
    };

    // spec = { kind, brushes?: [ids], ...scenario options }. Returns
    // { kind, brushes, ms, report, images: [{ name, dataUrl, width, height }], ok? }.
    const runScenario = async (spec = {}) => {
      const kind = spec.kind || "contact";
      const fn = SCENARIOS[kind];
      if (!fn) {
        throw new Error(`unknown scenario "${kind}" (have: ${Object.keys(SCENARIOS).join(", ")})`);
      }
      const brushes = listBrushes(spec.brushes);
      status.textContent = `running ${kind} for ${brushes.join(", ")}…`;
      // Yield once so the status paints before a long synchronous scenario.
      await new Promise((resolve) => requestAnimationFrame(resolve));
      const t0 = performance.now();
      const result = await fn({ ...spec, brushes });
      const ms = performance.now() - t0;
      status.textContent = `${kind} done in ${ms.toFixed(0)} ms`;
      return { kind, brushes, ms: +ms.toFixed(1), ...result };
    };

    window.lab = {
      ...engine,
      ready: true,
      error: null,
      TILE_W,
      TILE_H,
      COLORS,
      scenarios: Object.keys(SCENARIOS),
      listBrushes,
      makeStroke,
      makeSettings,
      paintStroke,
      measurePenUpPop,
      flushGpu,
      hashCanvas,
      loadFixture,
      runScenario,
    };
    status.textContent = `engine loaded — brushes: ${listBrushes().join(", ")}. Call lab.runScenario({ kind }) — kinds: ${Object.keys(SCENARIOS).join(", ")}.`;
  </script>
</body>
</html>
